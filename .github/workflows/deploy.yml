name: Build and Push to AWS ECR

on:
  push:
    branches:
      - main   // Trigger workflow on push to main branch
  workflow_dispatch: // Allows manual triggering of the workflow from the GitHub Actions UI


jobs:
  build-and-deploy:
    name: Build Docker Image, Push to ECR, and Update ECS
    runs-on: ubuntu-latest  # Runs natively on x86_64 / amd64 architecture

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: outage-job
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. Build native amd64 container
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          
          # 2. Push using unique Commit SHA tag (Works with Tag Immutability)
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Register New ECS Task Definition Revision
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: outage-job
          IMAGE_TAG: ${{ github.sha }}
          TASK_DEFINITION_NAME: outage-job-task
        run: |
          # 1. Fetch current task definition JSON
          TASK_DEF=$(aws ecs describe-task-definition --task-definition $TASK_DEFINITION_NAME)
          
          # 2. Replace container image URI with newly pushed SHA image and sanitize JSON metadata
          NEW_TASK_DEF=$(echo $TASK_DEF | jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" '.taskDefinition | .containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          
          # 3. Register the new active task definition revision in ECS
          aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF"